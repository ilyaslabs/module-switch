name: Call CI/CD Snapshot Workflow

on:
  push:
    branches-ignore:
      - main

jobs:
  release:
    uses: ilyaslabs/cicd/.github/workflows/gradle-snapshot-release.yml@claude/project-thread-spuea8
    secrets:
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
